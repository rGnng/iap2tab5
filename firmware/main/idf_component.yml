## IDF Component Manager Manifest File
dependencies:
  idf: '>=5.4'
  espressif/m5stack_tab5: 1.3.2
  espressif/esp_lvgl_port:
    version: "^2.9.0"
    override_path: "../components/esp_lvgl_port"
  espressif/usb_host_hid:
    version: "1.2.1"
    override_path: "../components/usb_host_hid"
  lvgl/lvgl: 9.6.0
  # IDF 5.5 provides the USB host stack and the FS/HS OTG controllers.
  # Let the component manager resolve the matching espressif/usb version.
  espressif/usb: '*'
  espressif/esp_hosted: ==2.13.1
  espressif/esp_wifi_remote: ==1.6.3
  espressif/libjpeg-turbo: "3.2.0~1"
