## IDF Component Manager Manifest File
dependencies:
  idf: '>=5.4'
  espressif/m5stack_tab5: 1.3.2
  espressif/esp_lvgl_port:
    version: "^2.9.0"
    override_path: "../components/esp_lvgl_port"
  espressif/usb_host_hid: ^1.2.0
  lvgl/lvgl: 9.6.0
  # Use the USB host library shipped with ESP-IDF 5.4. The registry's
  # espressif/usb >=1.0 uses HAL FIFO APIs that only exist in IDF 5.5,
  # despite declaring IDF >=5.4.
  espressif/usb:
    version: '*'
    override_path: ../components/usb
  espressif/esp_hosted: ==2.13.1
  espressif/esp_wifi_remote: ==1.6.3
